[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlib"
version = "0.1.0"
description = "Local Qlib-format data, expressions, historical filters and daily backtesting"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "joblib>=1.3"]

[project.optional-dependencies]
download = ["tushare", "tqdm"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3,<4", "myst-parser>=3,<5", "tqdm>=4"]

[tool.setuptools.packages.find]
include = ["qlib*"]

[tool.setuptools.package-data]
"qlib.data._libs" = ["*.c", "*.h", "LICENSE"]
"qlib.contrib.eva" = ["LICENSE"]
"qlib.contrib.strategy" = ["LICENSE"]
