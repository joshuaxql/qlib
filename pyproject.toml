[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "qlib-joshuaxql"
version = "0.2.0"
description = "Local Qlib-format data, expressions, historical filters and daily backtesting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "qlib/data/_libs/LICENSE", "qlib/contrib/eva/LICENSE", "qlib/contrib/strategy/LICENSE"]
authors = [{name = "Qlib contributors"}]
keywords = ["quantitative-finance", "backtesting", "factor-analysis", "qlib"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "joblib>=1.3", "loguru>=0.7", "pyecharts>=2.1,<3"]

[project.urls]
Documentation = "https://qlib-joshuaxql.readthedocs.io/"
Repository = "https://github.com/joshuaxql/qlib"
Issues = "https://github.com/joshuaxql/qlib/issues"
Dataset = "https://huggingface.co/datasets/joshuaxql/qlib_data"

[project.optional-dependencies]
download = ["tushare"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3,<4", "myst-parser>=3,<5"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["qlib*"]
namespaces = false

[tool.setuptools.exclude-package-data]
"*" = ["*.dll", "*.so", "*.dylib", "*.pyd", "*.pyc"]

[tool.setuptools.package-data]
"qlib.data._libs" = ["*.c", "*.h", "LICENSE"]
"qlib.contrib.eva" = ["LICENSE"]
"qlib.contrib.strategy" = ["LICENSE"]
"qlib.contrib.report.analysis_model" = ["_assets/*.html", "_assets/*.js", "_assets/*.txt", "_assets/*.json"]
